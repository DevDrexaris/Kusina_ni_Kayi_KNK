<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#285943" />
    <link
      rel="preload"
      href="/assets/fonts/super_waffles/Super%20Waffles.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kusina ni Kayi</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: #faf8f2;
      }
      #startup-loading {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 26px;
        background: #faf8f2;
      }
      #startup-loading img {
        display: block;
        width: min(72vw, 330px);
        height: auto;
        animation: startup-logo-pulse 2.2s ease-in-out infinite;
      }
      #startup-loading span {
        position: relative;
        width: 54px;
        height: 4px;
        overflow: hidden;
        border-radius: 99px;
        background: #dce6db;
      }
      #startup-loading span:after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: #285943;
        content: '';
        animation: startup-progress 1.15s ease-in-out infinite;
      }
      @keyframes startup-logo-pulse {
        0%,
        100% {
          opacity: 0.88;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes startup-progress {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(265%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-loading img,
        #startup-loading span:after {
          animation: none;
        }
        #startup-loading span:after {
          left: 31%;
          width: 38%;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-loading" role="status" aria-label="Loading Kusina ni Kayi">
      <img src="/assets/KnK_Vector_Logo.svg" alt="Kusina ni Kayi logo" />
      <span aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
